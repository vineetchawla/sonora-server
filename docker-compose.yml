services:
  api:
    build: .
    env_file: .env
    ports:
      - "${SONORA_PORT:-3333}:3333"
    volumes:
      - ./data/audiobooks:/media/audiobooks:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sonora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sonora-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-sonora}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
